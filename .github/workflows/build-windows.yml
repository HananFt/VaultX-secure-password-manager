name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm VaultX.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-Windows
          path: dist/VaultX.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "dist/VaultX.exe" --title "${{ github.ref_name }}" --generate-notes
