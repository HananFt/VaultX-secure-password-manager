name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Security Linter (Bandit)
      run: |
        # Exclude tests/ directory to prevent Bandit from failing on standard pytest 'assert' statements
        bandit -r . -ll -ii -x tests/

    - name: Run Automated Tests (Pytest)
      run: |
        pytest tests/ -v

    - name: Build Executable with PyInstaller
      run: python -m PyInstaller VaultX.spec --noconfirm

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VaultX-Executable
        path: dist/VaultX.exe

    # If triggered by a tag, create a GitHub Release
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/VaultX.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}